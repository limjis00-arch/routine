<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>지수의 루틴</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
      .no-print { display: none !important; }
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans selection:bg-green-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 아이콘 컴포넌트 ---
    const IconHome = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const IconPieChart = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;
    const IconCalendarDays = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const IconSettings = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    const IconPlus = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>;
    const IconCheck = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>;
    const IconCoffee = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>;
    const IconTrash2 = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
    const IconDownload = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
    const IconUpload = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
    const IconFileText = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;
    const IconX = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>;
    const IconChevronLeft = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="15 18 9 12 15 6"/></svg>;
    const IconChevronRight = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"/></svg>;
    const IconChevronDown = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"/></svg>;
    const IconChevronUp = ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="18 15 12 9 6 15"/></svg>;

    // --- 유틸리티 함수 ---
    const getTodayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const addDays = (dateStr, days) => {
      const [y, m, d] = dateStr.split('-');
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + days);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    };

    const calculateDaysDiff = (date1, date2) => {
      const d1 = new Date(date1);
      const d2 = new Date(date2);
      d1.setHours(0, 0, 0, 0);
      d2.setHours(0, 0, 0, 0);
      return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
    };

    const isScheduledForDate = (item, dateStr) => {
      const targetDate = new Date(dateStr);
      const startDate = new Date(item.startDate);
      const diffDays = calculateDaysDiff(item.startDate, dateStr);
      
      if (diffDays < 0) return false;

      switch (item.frequency) {
        case 'daily':
          return true;
        case 'weekly':
          return targetDate.getDay() === startDate.getDay();
        case 'biweekly':
          const diffWeeks = Math.floor(diffDays / 7);
          return targetDate.getDay() === startDate.getDay() && diffWeeks % 2 === 0;
        case 'monthly':
          if (targetDate.getDate() === startDate.getDate()) return true;
          const lastDayOfTargetMonth = new Date(targetDate.getFullYear(), targetDate.getMonth() + 1, 0).getDate();
          if (startDate.getDate() > lastDayOfTargetMonth && targetDate.getDate() === lastDayOfTargetMonth) return true;
          return false;
        default:
          return false;
      }
    };

    const getDatesInRange = (startStr, endStr) => {
      const dates = [];
      let current = new Date(startStr);
      const end = new Date(endStr);
      while (current <= end) {
        dates.push(`${current.getFullYear()}-${String(current.getMonth() + 1).padStart(2, '0')}-${String(current.getDate()).padStart(2, '0')}`);
        current.setDate(current.getDate() + 1);
      }
      return dates;
    };

    const getWeekRange = () => {
      const d = new Date();
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const start = new Date(d.getFullYear(), d.getMonth(), diff);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      return {
        start: `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, '0')}-${String(start.getDate()).padStart(2, '0')}`,
        end: `${end.getFullYear()}-${String(end.getMonth() + 1).padStart(2, '0')}-${String(end.getDate()).padStart(2, '0')}`
      };
    };

    const getMonthRange = () => {
      const d = new Date();
      const start = new Date(d.getFullYear(), d.getMonth(), 1);
      const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      return {
        start: `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, '0')}-${String(start.getDate()).padStart(2, '0')}`,
        end: `${end.getFullYear()}-${String(end.getMonth() + 1).padStart(2, '0')}-${String(end.getDate()).padStart(2, '0')}`
      };
    };

    // --- 아코디언 컴포넌트 ---
    const Accordion = ({ title, progress, children, defaultOpen = true }) => {
      const [isOpen, setIsOpen] = useState(defaultOpen);
      return (
        <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden mb-4">
          <button 
            onClick={() => setIsOpen(!isOpen)} 
            className="w-full flex items-center justify-between p-4 bg-gray-50 hover:bg-gray-100 transition-colors text-left"
          >
            <div className="font-bold text-gray-800">{title}</div>
            <div className="flex items-center gap-3">
              <span className="text-sm font-bold text-green-600 bg-green-50 px-2 py-1 rounded-lg">{progress}% 달성</span>
              {isOpen ? <IconChevronUp className="w-5 h-5 text-gray-400"/> : <IconChevronDown className="w-5 h-5 text-gray-400"/>}
            </div>
          </button>
          {isOpen && (
            <div className="p-4 space-y-2 border-t border-gray-100 bg-white">
              {children}
            </div>
          )}
        </div>
      );
    };

    // --- 메인 앱 컴포넌트 ---
    function App() {
      const todayStr = getTodayStr();
      const tomorrowStr = addDays(todayStr, 1);
      
      const [activeTab, setActiveTab] = useState('today');
      const [categories, setCategories] = useState([]);
      const [history, setHistory] = useState({});
      
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [deleteModalTarget, setDeleteModalTarget] = useState(null); // 삭제 모달용 상태
      
      const [modalCategory, setModalCategory] = useState('');
      const [modalItems, setModalItems] = useState([{ name: '', frequency: 'daily' }]);
      const [reportType, setReportType] = useState('monthly');
      const [modalStartDate, setModalStartDate] = useState(todayStr);
      const [customWeekStart, setCustomWeekStart] = useState(todayStr);
      const [overviewTab, setOverviewTab] = useState('week');
      
      // 데이터 로드
      useEffect(() => {
        const savedData = localStorage.getItem('jisoo_routine_data');
        if (savedData) {
          try {
            const parsed = JSON.parse(savedData);
            if (parsed.categories) setCategories(parsed.categories);
            if (parsed.history) setHistory(parsed.history);
          } catch (e) {
            console.error("데이터 로드 실패:", e);
          }
        }
      }, []);

      // 데이터 자동 저장
      useEffect(() => {
        localStorage.setItem('jisoo_routine_data', JSON.stringify({ categories, history }));
      }, [categories, history]);

      const toggleRoutineStatus = (itemId, status, dateStr) => {
        setHistory(prev => {
          const newHistory = { ...prev };
          if (!newHistory[dateStr]) newHistory[dateStr] = {};
          
          if (newHistory[dateStr][itemId] === status) {
            delete newHistory[dateStr][itemId];
          } else {
            newHistory[dateStr][itemId] = status;
          }
          return newHistory;
        });
      };

      const executeDelete = () => {
        if (!deleteModalTarget) return;
        const { categoryId, itemId } = deleteModalTarget;
        setCategories(prev => prev.map(cat => {
          if (cat.id === categoryId) {
            return { ...cat, items: cat.items.filter(item => item.id !== itemId) };
          }
          return cat;
        }).filter(cat => cat.items.length > 0));
        setDeleteModalTarget(null);
      };

      // 1. 첫번째 페이지: 오늘(선택된 날짜) 해야할 루틴
      const renderTodayView = () => {
        const dateCategories = categories.map(cat => ({
          ...cat,
          items: cat.items.filter(item => isScheduledForDate(item, selectedDate))
        })).filter(cat => cat.items.length > 0);

        // 표시할 날짜 텍스트
        let displayDateText = selectedDate;
        if (selectedDate === todayStr) displayDateText = '오늘';
        else if (selectedDate === tomorrowStr) displayDateText = '내일';
        else {
          const [y, m, d] = selectedDate.split('-');
          displayDateText = `${parseInt(m)}월 ${parseInt(d)}일`;
        }

        // 해당 날짜 루틴 달성 검사
        let totalDue = 0; let completed = 0; let rested = 0;
        dateCategories.forEach(cat => {
          cat.items.forEach(item => {
            totalDue++;
            const status = history[selectedDate]?.[item.id];
            if (status === 'completed') completed++;
            if (status === 'rest') rested++;
          });
        });
        const isAllDone = totalDue > 0 && completed === (totalDue - rested);

        return (
          <div className="pb-24">
            {/* 날짜 이동 네비게이터 */}
            <div className="flex items-center justify-between bg-white p-2 rounded-2xl shadow-sm mb-6 border border-gray-100">
              <button onClick={() => setSelectedDate(addDays(selectedDate, -1))} className="p-3 text-gray-400 hover:text-green-600 transition-colors">
                <IconChevronLeft className="w-6 h-6" />
              </button>
              <div className="font-extrabold text-lg text-green-600">
                {displayDateText}의 루틴
              </div>
              <button onClick={() => setSelectedDate(addDays(selectedDate, 1))} className="p-3 text-gray-400 hover:text-green-600 transition-colors">
                <IconChevronRight className="w-6 h-6" />
              </button>
            </div>

            {/* 일정 없음 / 전체 루틴 보여주기 처리 */}
            {dateCategories.length === 0 ? (
              <div className="text-center">
                <div className="py-10 text-gray-500 bg-white rounded-2xl border border-gray-100 mb-6">
                  <IconCalendarDays className="w-12 h-12 mx-auto mb-3 opacity-30" />
                  <p className="font-bold text-gray-700">{displayDateText} 계획된 루틴이 없습니다.</p>
                  <p className="text-sm mt-2 opacity-80">아래는 내가 만든 전체 루틴 목록입니다.</p>
                </div>
                {/* 전체 루틴 목록 (비활성화 상태로 보여주기) */}
                <div className="opacity-70 pointer-events-none">
                  {categories.map(cat => (
                    <div key={cat.id} className="mb-4 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden text-left">
                      <div className="bg-gray-100 px-4 py-3 font-bold text-gray-600">{cat.name}</div>
                      <div className="divide-y divide-gray-50">
                        {cat.items.map(item => (
                          <div key={item.id} className="p-4 text-sm text-gray-500">{item.name} ({item.frequency})</div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <div>
                {/* 루틴을 모두 완료했을 때 메시지와 내일 버튼 */}
                {isAllDone && selectedDate === todayStr && (
                  <div className="bg-green-100 text-green-800 p-4 rounded-2xl mb-6 text-center border border-green-200">
                    <p className="font-bold text-lg mb-1">🎉 모든 루틴 완료!</p>
                    <p className="text-sm mb-3">오늘 하루도 수고하셨습니다.</p>
                    <button 
                      onClick={() => setSelectedDate(tomorrowStr)}
                      className="bg-white text-green-700 px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-green-50"
                    >
                      내일 루틴 준비하기 ➔
                    </button>
                  </div>
                )}

                {/* 오늘의 루틴 목록 */}
                {dateCategories.map(cat => (
                  <div key={cat.id} className="mb-5 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div className="bg-green-50 px-4 py-3 border-b border-gray-100">
                      <h3 className="font-bold text-green-800">{cat.name}</h3>
                    </div>
                    <div className="divide-y divide-gray-50">
                      {cat.items.map(item => {
                        const status = history[selectedDate]?.[item.id];
                        const isCompleted = status === 'completed';
                        const isRested = status === 'rest';

                        return (
                          <div key={item.id} className="p-4 flex items-center justify-between transition-colors hover:bg-gray-50">
                            <div className="flex-1" onClick={() => toggleRoutineStatus(item.id, isCompleted ? '' : 'completed', selectedDate)}>
                              <p className={`font-medium ${isCompleted || isRested ? 'text-gray-400 line-through' : 'text-gray-700'}`}>
                                {item.name}
                              </p>
                              <p className="text-xs text-gray-400 mt-1">
                                {item.frequency === 'daily' && '매일'}
                                {item.frequency === 'weekly' && '매주'}
                                {item.frequency === 'biweekly' && '2주마다'}
                                {item.frequency === 'monthly' && '매월'}
                              </p>
                            </div>
                            <div className="flex items-center gap-2">
                              <button 
                                onClick={(e) => { e.stopPropagation(); toggleRoutineStatus(item.id, 'rest', selectedDate); }}
                                className={`p-2 rounded-full transition-all ${isRested ? 'bg-orange-100 text-orange-600' : 'bg-gray-100 text-gray-400 hover:bg-orange-50 hover:text-orange-500'}`}
                              >
                                <IconCoffee className="w-5 h-5" />
                              </button>
                              <button 
                                onClick={(e) => { e.stopPropagation(); toggleRoutineStatus(item.id, 'completed', selectedDate); }}
                                className={`p-2 rounded-full transition-all ${isCompleted ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400 hover:bg-green-50 hover:text-green-500'}`}
                              >
                                <IconCheck className="w-5 h-5" />
                              </button>
                              <button 
                                onClick={(e) => { e.stopPropagation(); setDeleteModalTarget({ categoryId: cat.id, itemId: item.id }); }}
                                className="p-2 text-gray-300 hover:text-red-500 transition-colors ml-1"
                              >
                                <IconTrash2 className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            )}

            <button 
              onClick={() => {
                setModalCategory('');
                setModalItems([{ name: '', frequency: 'daily' }]);
                setModalStartDate(selectedDate); // 현재 보고 있는 날짜를 기본 시작일로
                setIsAddModalOpen(true);
              }}
              className="fixed bottom-20 right-6 w-14 h-14 bg-green-600 hover:bg-green-700 text-white rounded-full shadow-lg flex items-center justify-center transition-transform hover:scale-105 active:scale-95 z-30"
            >
              <IconPlus className="w-6 h-6" />
            </button>
          </div>
        );
      };

      // 2. 두번째 페이지: 오늘의 달성률 (아코디언 적용)
      const renderProgressView = () => {
        let totalDue = 0; let completed = 0; let rested = 0;
        const catStats = {};

        categories.forEach(cat => {
          let catDue = 0; let catCompleted = 0; let catRested = 0;
          
          cat.items.forEach(item => {
            if (isScheduledForDate(item, todayStr)) {
              catDue++; totalDue++;
              const status = history[todayStr]?.[item.id];
              if (status === 'completed') { catCompleted++; completed++; }
              if (status === 'rest') { catRested++; rested++; }
            }
          });
          
          if (catDue > 0) {
            const active = catDue - catRested;
            const rate = active === 0 ? 0 : Math.round((catCompleted / active) * 100);
            catStats[cat.id] = { ...cat, rate, due: catDue, comp: catCompleted, rest: catRested, active };
          }
        });

        const activeTotal = totalDue - rested;
        const progressRate = activeTotal === 0 ? (totalDue === 0 ? 0 : 100) : Math.round((completed / activeTotal) * 100);

        return (
          <div className="pb-24">
            <h2 className="text-2xl font-bold text-gray-800 mb-6">오늘의 달성률</h2>
            
            <div className="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 text-center mb-6">
              <div className="relative w-48 h-48 mx-auto mb-4">
                <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                  <circle cx="50" cy="50" r="45" fill="none" stroke="#f3f4f6" strokeWidth="10" />
                  <circle 
                    cx="50" cy="50" r="45" fill="none" stroke="#16a34a" strokeWidth="10" 
                    strokeDasharray={`${progressRate * 2.827} 282.7`} 
                    className="transition-all duration-1000 ease-out"
                    strokeLinecap="round"
                  />
                </svg>
                <div className="absolute inset-0 flex flex-col items-center justify-center">
                  <span className="text-4xl font-bold text-gray-800">{progressRate}%</span>
                  <span className="text-sm text-gray-500 mt-1">완료율</span>
                </div>
              </div>
              
              <div className="flex justify-center gap-6 mt-6">
                <div className="text-center">
                  <p className="text-sm text-gray-500">전체 대상</p>
                  <p className="text-xl font-bold text-gray-800">{activeTotal}개</p>
                </div>
                <div className="w-px bg-gray-200"></div>
                <div className="text-center">
                  <p className="text-sm text-gray-500">완료</p>
                  <p className="text-xl font-bold text-green-600">{completed}개</p>
                </div>
                <div className="w-px bg-gray-200"></div>
                <div className="text-center">
                  <p className="text-sm text-gray-500">휴식</p>
                  <p className="text-xl font-bold text-orange-500">{rested}개</p>
                </div>
              </div>
            </div>

            <div>
              <h3 className="text-lg font-bold text-gray-800 mb-4">항목별 세부사항 (오늘)</h3>
              {Object.values(catStats).length === 0 && <p className="text-gray-400 text-center py-4">오늘 계획된 루틴이 없습니다.</p>}
              
              {Object.values(catStats).map(cat => (
                <Accordion key={cat.id} title={cat.name} progress={cat.rate} defaultOpen={true}>
                  {cat.items.filter(item => isScheduledForDate(item, todayStr)).map(item => {
                    const status = history[todayStr]?.[item.id];
                    return (
                      <div key={item.id} className="flex justify-between items-center p-2 rounded-lg">
                        <span className="text-sm font-medium text-gray-700">{item.name}</span>
                        {status === 'completed' ? (
                          <span className="text-xs font-bold text-green-700 bg-green-100 px-2 py-1 rounded-md">완료</span>
                        ) : status === 'rest' ? (
                          <span className="text-xs font-bold text-orange-700 bg-orange-100 px-2 py-1 rounded-md">휴식</span>
                        ) : (
                          <span className="text-xs font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded-md">미완료</span>
                        )}
                      </div>
                    );
                  })}
                </Accordion>
              ))}
            </div>
          </div>
        );
      };

      // 3. 세번째 페이지: 이번주/이달 통계 및 루틴 모아보기 (아코디언 적용)
      const renderOverviewView = () => {
        const getRangeStats = (startStr, endStr) => {
          const dates = getDatesInRange(startStr, endStr);
          let totalDue = 0; let totalCompleted = 0; let totalRested = 0;
          const groupedStats = {}; // 카테고리별로 묶기

          categories.forEach(cat => {
            groupedStats[cat.id] = { name: cat.name, expected: 0, completed: 0, rested: 0, items: [] };
          });

          dates.forEach(dateStr => {
            categories.forEach(cat => {
              cat.items.forEach(item => {
                if (isScheduledForDate(item, dateStr)) {
                  let itemStat = groupedStats[cat.id].items.find(i => i.id === item.id);
                  if (!itemStat) {
                    itemStat = { id: item.id, name: item.name, expected: 0, completed: 0, rested: 0 };
                    groupedStats[cat.id].items.push(itemStat);
                  }
                  
                  itemStat.expected++;
                  groupedStats[cat.id].expected++;
                  totalDue++;

                  const status = history[dateStr]?.[item.id];
                  if (status === 'completed') {
                    itemStat.completed++;
                    groupedStats[cat.id].completed++;
                    totalCompleted++;
                  } else if (status === 'rest') {
                    itemStat.rested++;
                    groupedStats[cat.id].rested++;
                    totalRested++;
                  }
                }
              });
            });
          });

          const activeTotal = totalDue - totalRested;
          const rate = activeTotal === 0 ? (totalDue === 0 ? 0 : 100) : Math.round((totalCompleted / activeTotal) * 100);

          return { rate, activeTotal, totalCompleted, totalRested, groupedStats };
        };

        const weekRange = getWeekRange();
        const monthRange = getMonthRange();
        const stats = overviewTab === 'week' ? getRangeStats(weekRange.start, weekRange.end) : getRangeStats(monthRange.start, monthRange.end);
        
        // 데이터가 존재하는 카테고리만 필터링
        const validCategories = Object.values(stats.groupedStats).filter(cat => cat.expected > 0);

        return (
          <div className="pb-24">
            <h2 className="text-2xl font-bold text-gray-800 mb-6">달성률 모아보기</h2>
            
            <div className="flex bg-gray-200 p-1 rounded-xl mb-6">
              <button 
                onClick={() => setOverviewTab('week')}
                className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${overviewTab === 'week' ? 'bg-white text-green-600 shadow' : 'text-gray-500 hover:text-gray-700'}`}
              >
                이번 주
              </button>
              <button 
                onClick={() => setOverviewTab('month')}
                className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${overviewTab === 'month' ? 'bg-white text-green-600 shadow' : 'text-gray-500 hover:text-gray-700'}`}
              >
                이번 달
              </button>
            </div>

            <div className="bg-white rounded-2xl p-6 mb-6 text-center border border-gray-100 shadow-sm relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-1 bg-green-500"></div>
              <h3 className="text-lg font-bold text-gray-800 mb-2">
                {overviewTab === 'week' ? '주간 종합 달성률' : '월간 종합 달성률'}
              </h3>
              <div className="text-4xl font-black text-green-600 mb-4">{stats.rate}%</div>
              <div className="flex justify-center gap-4 text-sm bg-gray-50 p-3 rounded-xl inline-flex mx-auto">
                <span className="text-gray-600">대상: <b>{stats.activeTotal}</b></span>
                <span className="text-gray-600">완료: <b className="text-green-600">{stats.totalCompleted}</b></span>
                <span className="text-gray-600">휴식: <b className="text-orange-500">{stats.totalRested}</b></span>
              </div>
            </div>

            <h3 className="text-lg font-bold text-gray-800 mb-4">제목별 세부 달성 내역</h3>
            {validCategories.length === 0 ? (
              <div className="text-center py-10 text-gray-400 bg-white rounded-xl border border-gray-100">
                이번 기간에 계획된 루틴이 없습니다.
              </div>
            ) : (
              <div>
                {validCategories.map((cat, idx) => {
                  const catActive = cat.expected - cat.rested;
                  const catRate = catActive === 0 ? 0 : Math.round((cat.completed / catActive) * 100);
                  
                  return (
                    <Accordion key={idx} title={cat.name} progress={catRate} defaultOpen={false}>
                      {cat.items.map((item, iIdx) => {
                        const itemActive = item.expected - item.rested;
                        const itemRate = itemActive === 0 ? 0 : Math.round((item.completed / itemActive) * 100);
                        
                        return (
                          <div key={iIdx} className="flex justify-between items-center p-2 border-b border-gray-50 last:border-0">
                            <span className="text-sm font-medium text-gray-700">{item.name}</span>
                            <div className="text-right flex items-center gap-3">
                                <span className="text-xs text-gray-500">
                                  {item.completed}/{itemActive} 완료 {item.rested > 0 && <span className="text-orange-400">(휴식{item.rested})</span>}
                                </span>
                                <span className="text-sm font-bold text-green-600 w-10 text-right">{itemRate}%</span>
                            </div>
                          </div>
                        );
                      })}
                    </Accordion>
                  );
                })}
              </div>
            )}
          </div>
        );
      };

      // 4. 네번째 페이지: 설정
      const renderSettingsView = () => {
        const handleExportJSON = () => {
          const dataStr = JSON.stringify({ categories, history });
          const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
          const exportFileDefaultName = `jisoo_routine_backup_${todayStr}.json`;
          const linkElement = document.createElement('a');
          linkElement.setAttribute('href', dataUri);
          linkElement.setAttribute('download', exportFileDefaultName);
          linkElement.click();
        };

        const handleImportJSON = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.categories && parsed.history) {
                setCategories(parsed.categories);
                setHistory(parsed.history);
                alert("데이터가 성공적으로 복원되었습니다!");
              } else {
                alert("유효하지 않은 백업 파일입니다.");
              }
            } catch (err) {
              alert("파일을 읽는 중 오류가 발생했습니다.");
            }
          };
          reader.readAsText(file);
        };

        const handlePDFPrint = (type) => {
          setReportType(type);
          setTimeout(() => { window.print(); }, 300);
        };

        return (
          <div className="pb-24">
            <h2 className="text-2xl font-bold text-gray-800 mb-6">설정 및 데이터 관리</h2>
            
            <div className="space-y-4">
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h3 className="font-bold text-gray-800 mb-2 flex items-center gap-2">
                  <IconDownload className="w-5 h-5 text-green-500" /> 데이터 백업
                </h3>
                <p className="text-sm text-gray-500 mb-4">휴대폰을 바꿔도 기록을 유지할 수 있도록 데이터를 파일로 저장합니다.</p>
                <button 
                  onClick={handleExportJSON}
                  className="w-full py-3 bg-green-50 text-green-600 font-medium rounded-xl hover:bg-green-100 transition-colors"
                >
                  백업 파일 다운로드 (.json)
                </button>
              </div>

              <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h3 className="font-bold text-gray-800 mb-2 flex items-center gap-2">
                  <IconUpload className="w-5 h-5 text-teal-500" /> 데이터 복원
                </h3>
                <p className="text-sm text-gray-500 mb-4">저장해둔 백업 파일을 불러와 데이터를 복구합니다.</p>
                <label className="block w-full py-3 bg-teal-50 text-teal-600 font-medium rounded-xl hover:bg-teal-100 transition-colors text-center cursor-pointer">
                  백업 파일 불러오기
                  <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                </label>
              </div>

              <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h3 className="font-bold text-gray-800 mb-2 flex items-center gap-2">
                  <IconFileText className="w-5 h-5 text-red-500" /> PDF 보고서 저장
                </h3>
                <p className="text-sm text-gray-500 mb-4">주간, 월간, 연간 달성률 통계를 PDF로 인쇄하거나 저장합니다.</p>
                <div className="flex flex-col gap-3">
                  <div className="bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <label className="block text-sm font-medium text-gray-700 mb-2">주간 리포트 시작 날짜 선택</label>
                    <input 
                      type="date"
                      value={customWeekStart}
                      onChange={(e) => setCustomWeekStart(e.target.value)}
                      className="w-full p-2 mb-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-red-500 outline-none bg-white"
                    />
                    <button 
                      onClick={() => handlePDFPrint('weekly')}
                      className="w-full py-2 bg-red-100 text-red-600 font-medium rounded-lg hover:bg-red-200 transition-colors"
                    >
                      지정 주간(7일) 통계 리포트
                    </button>
                  </div>
                  <button 
                    onClick={() => handlePDFPrint('monthly')}
                    className="w-full py-3 bg-red-50 text-red-600 font-medium rounded-xl hover:bg-red-100 transition-colors"
                  >
                    월간 통계 리포트 (이번 달)
                  </button>
                  <button 
                    onClick={() => handlePDFPrint('yearly')}
                    className="w-full py-3 bg-red-50 text-red-600 font-medium rounded-xl hover:bg-red-100 transition-colors"
                  >
                    연간 통계 리포트 (올해)
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const PrintReport = () => {
        const now = new Date();
        let targetTotal = 0; let targetCompleted = 0; let targetRested = 0;
        let reportTitle = "";

        const customStartObj = new Date(customWeekStart);
        customStartObj.setDate(customStartObj.getDate() + 6);
        const customWeekEnd = `${customStartObj.getFullYear()}-${String(customStartObj.getMonth() + 1).padStart(2, '0')}-${String(customStartObj.getDate()).padStart(2, '0')}`;

        Object.entries(history).forEach(([dateStr, items]) => {
          const dateObj = new Date(dateStr);
          let includeInReport = false;

          if (reportType === 'weekly') {
            if (dateStr >= customWeekStart && dateStr <= customWeekEnd) includeInReport = true;
          } else if (reportType === 'monthly') {
            if (dateObj.getMonth() === now.getMonth() && dateObj.getFullYear() === now.getFullYear()) includeInReport = true;
          } else if (reportType === 'yearly') {
            if (dateObj.getFullYear() === now.getFullYear()) includeInReport = true;
          }

          if (includeInReport) {
            Object.values(items).forEach(status => {
              targetTotal++;
              if (status === 'completed') targetCompleted++;
              if (status === 'rest') targetRested++;
            });
          }
        });
        
        const activeTotal = targetTotal - targetRested;
        const rate = activeTotal === 0 ? 0 : Math.round((targetCompleted / activeTotal) * 100);

        if (reportType === 'weekly') reportTitle = `${customWeekStart} ~ ${customWeekEnd} 주간 달성률 요약`;
        else if (reportType === 'monthly') reportTitle = `${now.getFullYear()}년 ${now.getMonth() + 1}월 달성률 요약`;
        else if (reportType === 'yearly') reportTitle = `${now.getFullYear()}년 연간 달성률 요약`;

        return (
          <div id="print-area" className="hidden p-8 bg-white text-black">
            <h1 className="text-3xl font-bold text-center mb-8 border-b pb-4">지수의 루틴 리포트</h1>
            <div className="mb-8">
              <h2 className="text-xl font-bold mb-4">{reportTitle}</h2>
              <div className="text-lg mb-2">총 완료: {targetCompleted}건</div>
              <div className="text-lg mb-2">휴식: {targetRested}건</div>
              <div className="text-2xl font-bold mt-4 text-green-600">종합 달성률: {rate}%</div>
              <p className="text-sm text-gray-500 mt-2">* 휴식은 통계 하락에 영향을 주지 않습니다.</p>
            </div>
            
            <div>
              <h2 className="text-xl font-bold mb-4">내 루틴 목록</h2>
              {categories.map(cat => (
                <div key={cat.id} className="mb-4">
                  <h3 className="font-bold bg-gray-100 p-2">{cat.name}</h3>
                  <ul className="list-disc pl-6 mt-2">
                    {cat.items.map(item => (
                      <li key={item.id}>{item.name} ({item.frequency})</li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-gray-50 font-sans selection:bg-green-200">
          <PrintReport />

          <header className="bg-white shadow-sm sticky top-0 z-10 no-print">
            <div className="max-w-md mx-auto px-6 py-4 flex items-center justify-between">
              <h1 className="text-xl font-extrabold text-green-600 tracking-tight" onClick={() => setSelectedDate(todayStr)}>지수의 루틴 ✨</h1>
            </div>
          </header>

          <main className="max-w-md mx-auto p-6 min-h-[calc(100vh-140px)] no-print relative">
            {activeTab === 'today' && renderTodayView()}
            {activeTab === 'progress' && renderProgressView()}
            {activeTab === 'overview' && renderOverviewView()}
            {activeTab === 'settings' && renderSettingsView()}
          </main>

          {/* 삭제 확인 전용 모달창 */}
          {deleteModalTarget && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 no-print">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center">
                <IconTrash2 className="w-12 h-12 mx-auto text-red-500 mb-4" />
                <h3 className="text-lg font-bold text-gray-800 mb-2">루틴을 삭제하시겠습니까?</h3>
                <p className="text-sm text-gray-500 mb-6">삭제된 루틴은 복구할 수 없습니다.</p>
                <div className="flex gap-3">
                  <button onClick={() => setDeleteModalTarget(null)} className="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200">취소</button>
                  <button onClick={executeDelete} className="flex-1 py-3 bg-red-500 text-white font-bold rounded-xl hover:bg-red-600">삭제하기</button>
                </div>
              </div>
            </div>
          )}

          {isAddModalOpen && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 no-print">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl transform transition-all max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold text-gray-800">새로운 루틴 만들기</h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="text-gray-400 hover:text-gray-600">
                    <IconX className="w-6 h-6" />
                  </button>
                </div>
                
                <form onSubmit={(e) => {
                  e.preventDefault();
                  
                  if (!modalCategory.trim()) return alert("루틴 제목(카테고리)을 입력해주세요.");
                  const validItems = modalItems.filter(item => item.name.trim() !== '');
                  if (validItems.length === 0) return alert("최소 1개의 세부 루틴 내용을 입력해주세요.");

                  const newRoutineItems = validItems.map((item, idx) => ({
                    id: 'r_' + Date.now() + '_' + idx,
                    name: item.name.trim(),
                    frequency: item.frequency,
                    startDate: modalStartDate
                  }));

                  setCategories(prev => {
                    const existingCat = prev.find(c => c.name === modalCategory.trim());
                    if (existingCat) {
                      return prev.map(c => c.name === modalCategory.trim() ? { ...c, items: [...c.items, ...newRoutineItems] } : c);
                    } else {
                      return [...prev, { id: 'c_' + Date.now(), name: modalCategory.trim(), items: newRoutineItems }];
                    }
                  });
                  
                  setIsAddModalOpen(false);
                }}>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">루틴 제목 (카테고리)</label>
                      <input 
                        value={modalCategory} 
                        onChange={(e) => setModalCategory(e.target.value)}
                        placeholder="예: 아침 루틴, 운동, 독서" 
                        className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none" 
                        required 
                        list="cat-list"
                      />
                      <datalist id="cat-list">
                        {categories.map(c => <option key={c.id} value={c.name} />)}
                      </datalist>
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">시작 날짜</label>
                      <input 
                        type="date"
                        value={modalStartDate}
                        onChange={(e) => setModalStartDate(e.target.value)}
                        className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none bg-white"
                        required
                      />
                    </div>

                    <div className="pt-2 border-t border-gray-100">
                      <label className="block text-sm font-medium text-gray-700 mb-2">세부 루틴 항목</label>
                      <div className="space-y-3">
                        {modalItems.map((item, index) => (
                          <div key={index} className="flex flex-col gap-2 p-3 bg-gray-50 rounded-xl relative border border-gray-100">
                            {modalItems.length > 1 && (
                              <button 
                                type="button" 
                                onClick={() => setModalItems(modalItems.filter((_, i) => i !== index))}
                                className="absolute top-2 right-2 p-1 text-gray-400 hover:text-red-500"
                              >
                                <IconX className="w-4 h-4" />
                              </button>
                            )}
                            <input 
                              value={item.name}
                              onChange={(e) => {
                                const newItems = [...modalItems];
                                newItems[index].name = e.target.value;
                                setModalItems(newItems);
                              }}
                              placeholder="예: 물 한잔 마시기" 
                              className="w-full p-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm pr-8" 
                              required 
                            />
                            <select 
                              value={item.frequency}
                              onChange={(e) => {
                                const newItems = [...modalItems];
                                newItems[index].frequency = e.target.value;
                                setModalItems(newItems);
                              }}
                              className="w-full p-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none bg-white text-sm"
                            >
                              <option value="daily">매일</option>
                              <option value="weekly">매주 (시작일 요일 기준)</option>
                              <option value="biweekly">2주마다 (시작일 요일 기준)</option>
                              <option value="monthly">한달 (시작일 날짜 기준)</option>
                            </select>
                          </div>
                        ))}
                      </div>
                      
                      <button 
                        type="button" 
                        onClick={() => setModalItems([...modalItems, { name: '', frequency: 'daily' }])}
                        className="mt-3 w-full py-2 bg-gray-100 text-gray-600 text-sm font-medium rounded-lg hover:bg-gray-200 transition-colors flex items-center justify-center gap-1"
                      >
                        <IconPlus className="w-4 h-4" /> 세부 항목 추가하기
                      </button>
                    </div>
                  </div>
                  <button type="submit" className="w-full mt-6 py-3.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-md transition-colors">
                    루틴 저장하기
                  </button>
                </form>
              </div>
            </div>
          )}

          <nav className="fixed bottom-0 w-full bg-white border-t border-gray-100 pb-safe z-40 no-print">
            <div className="max-w-md mx-auto flex justify-around p-2">
              <button 
                onClick={() => { setActiveTab('today'); setSelectedDate(todayStr); }}
                className={`flex flex-col items-center p-2 min-w-[64px] ${activeTab === 'today' ? 'text-green-600' : 'text-gray-400 hover:text-gray-600'}`}
              >
                <IconHome className={`w-6 h-6 mb-1 ${activeTab === 'today' ? 'fill-current' : ''}`} />
                <span className="text-[10px] font-medium">홈</span>
              </button>
              <button 
                onClick={() => setActiveTab('progress')}
                className={`flex flex-col items-center p-2 min-w-[64px] ${activeTab === 'progress' ? 'text-green-600' : 'text-gray-400 hover:text-gray-600'}`}
              >
                <IconPieChart className={`w-6 h-6 mb-1 ${activeTab === 'progress' ? 'fill-current' : ''}`} />
                <span className="text-[10px] font-medium">달성률</span>
              </button>
              <button 
                onClick={() => setActiveTab('overview')}
                className={`flex flex-col items-center p-2 min-w-[64px] ${activeTab === 'overview' ? 'text-green-600' : 'text-gray-400 hover:text-gray-600'}`}
              >
                <IconCalendarDays className={`w-6 h-6 mb-1 ${activeTab === 'overview' ? 'fill-current' : ''}`} />
                <span className="text-[10px] font-medium">모아보기</span>
              </button>
              <button 
                onClick={() => setActiveTab('settings')}
                className={`flex flex-col items-center p-2 min-w-[64px] ${activeTab === 'settings' ? 'text-green-600' : 'text-gray-400 hover:text-gray-600'}`}
              >
                <IconSettings className={`w-6 h-6 mb-1 ${activeTab === 'settings' ? 'fill-current' : ''}`} />
                <span className="text-[10px] font-medium">설정</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
